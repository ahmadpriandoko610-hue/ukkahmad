name: Deploy to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, bcmath, fileinfo, zip
          coverage: none

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Composer Dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: 🎨 Install NPM & Build Vite Assets
        run: |
          npm ci || npm install
          npm run build

      - name: 📦 Package App into ZIP
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          # 1. Buat direktori penampung
          mkdir -p deploy_package/ukk_rapi
          mkdir -p deploy_package/public_html

          # 2. Salin core files ke ukk_rapi dengan MENGECUALIKAN storage lokal, node_modules, git, env, dll.
          rsync -av --exclude='node_modules' \
                    --exclude='.git' \
                    --exclude='.github' \
                    --exclude='public' \
                    --exclude='storage' \
                    --exclude='.env*' \
                    --exclude='tests' \
                    --exclude='*.sql' \
                    --exclude='*.zip' \
                    ./ deploy_package/ukk_rapi/

          # 3. Salin berkas public ke public_html dengan MENGECUALIKAN folder storage
          rsync -av --exclude='storage' public/ deploy_package/public_html/

          # 4. Sesuaikan path bootstrap & vendor di index.php
          sed -i "s|__DIR__.'/../storage|__DIR__.'/../ukk_rapi/storage|g" deploy_package/public_html/index.php
          sed -i "s|__DIR__.'/../vendor|__DIR__.'/../ukk_rapi/vendor|g" deploy_package/public_html/index.php
          sed -i "s|__DIR__.'/../bootstrap|__DIR__.'/../ukk_rapi/bootstrap|g" deploy_package/public_html/index.php
          sed -i "s|\$app = require_once __DIR__.'/../ukk_rapi/bootstrap/app.php';|\$app = require_once __DIR__.'/../ukk_rapi/bootstrap/app.php';\n\$app->usePublicPath(__DIR__);|g" deploy_package/public_html/index.php

          # 5. Hitung SHA-256 hash dari token rahasia untuk verifikasi konstan
          TOKEN_HASH=$(php -r 'echo hash("sha256", (string)getenv("DEPLOY_TOKEN"));')
          EMPTY_HASH="e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"

          if [ -z "$TOKEN_HASH" ] || [ "$TOKEN_HASH" = "$EMPTY_HASH" ]; then
            echo "::error::Secret DEPLOY_TOKEN belum diset di GitHub Repository Secrets! Deployment dibatalkan."
            exit 1
          fi

          # 6. Buat skrip PHP ekstraksi otomatis di cPanel dengan verifikasi ketat & tanpa operator @
          cat << 'EOF' > deploy_package/public_html/auto_extract.php
          <?php
          if ($_SERVER['REQUEST_METHOD'] !== 'POST') {
              http_response_code(405);
              header('Allow: POST');
              die('Method Not Allowed');
          }

          $expectedHash = '__EXPECTED_TOKEN_HASH__';
          $providedToken = (string)($_POST['token'] ?? '');

          if (empty($expectedHash) || empty($providedToken) || !hash_equals($expectedHash, hash('sha256', $providedToken))) {
              http_response_code(403);
              die('Access Denied');
          }

          $stagingDir = __DIR__ . '/.deploy_staging';
          $zipFile = $stagingDir . '/deploy_payload.zip';
          if (!file_exists($zipFile)) {
              $zipFile = __DIR__ . '/deploy_payload.zip';
          }
          $selfFile = __FILE__;
          $hostingRoot = dirname(__DIR__);
          $ukkRapiRoot = realpath(__DIR__ . '/../ukk_rapi') ?: ($hostingRoot . '/ukk_rapi');
          $frameworkDir = $ukkRapiRoot . '/storage/framework';
          $downFile = $frameworkDir . '/down';
          $wasAlreadyInMaintenance = file_exists($downFile);

          // Simpan kondisi awal public_html/storage sebelum tersentuh
          $storageLink = __DIR__ . '/storage';
          $wasStorageLinkInitially = is_link($storageLink);
          $initialStorageTarget = $wasStorageLinkInitially ? readlink($storageLink) : null;
          $wasStoragePhysicalInitially = (is_dir($storageLink) && !$wasStorageLinkInitially);
          $wasStorageEmptyPhysicalInitially = false;
          if ($wasStoragePhysicalInitially) {
              $initScan = scandir($storageLink);
              if ($initScan === false) {
                  $cleanupStaging(false);
                  http_response_code(500);
                  die("STORAGE_INSPECTION_FAILED: Gagal memindai direktori storage fisik awal: $storageLink");
              }
              $initEntries = array_diff($initScan, ['.', '..']);
              $wasStorageEmptyPhysicalInitially = empty($initEntries);
          }
          $physicalBackupPath = null;

          // Tahapan siklus penanganan storage fisik (State Tracking Machine)
          $STORAGE_STAGE_NOT_MODIFIED = 'not_modified';
          $STORAGE_STAGE_BACKUP_IN_PROGRESS = 'backup_in_progress';
          $STORAGE_STAGE_BACKUP_VERIFIED = 'backup_verified';
          $STORAGE_STAGE_MIGRATION_IN_PROGRESS = 'migration_in_progress';
          $STORAGE_STAGE_SOURCE_REMOVED = 'source_removed';
          $STORAGE_STAGE_SYMLINK_CREATED = 'symlink_created';

          $storageStage = $STORAGE_STAGE_NOT_MODIFIED;
          $backupIsVerified = false;

          // Helper pembersih direktori staging (HANYA menghapus berkas sementara)
          $cleanupStaging = function (bool $keepBackup = false) use ($zipFile, $stagingDir, $selfFile) {
              if (file_exists($zipFile)) {
                  unlink($zipFile);
              }
              if (is_dir($stagingDir) && basename($stagingDir) === '.deploy_staging') {
                  try {
                      $it = new RecursiveIteratorIterator(
                          new RecursiveDirectoryIterator($stagingDir, RecursiveDirectoryIterator::SKIP_DOTS),
                          RecursiveIteratorIterator::CHILD_FIRST
                      );
                      foreach ($it as $item) {
                          if ($keepBackup && str_contains($item->getPathname(), 'pre_deploy_backup')) {
                              continue;
                          }
                          if ($item->isLink() || $item->isFile()) {
                              unlink($item->getPathname());
                          } elseif ($item->isDir()) {
                              rmdir($item->getPathname());
                          }
                      }
                      if (!$keepBackup) {
                          rmdir($stagingDir);
                      }
                  } catch (\Throwable $e) {
                      // Pengabaian aman exception pada cleanup
                  }
              }
              if (file_exists($selfFile)) {
                  unlink($selfFile);
              }
          };

          if (!file_exists($zipFile)) {
              $cleanupStaging(false);
              http_response_code(404);
              die('PAYLOAD_NOT_FOUND');
          }

          $zip = new ZipArchive;
          if ($zip->open($zipFile) !== TRUE) {
              $cleanupStaging(false);
              http_response_code(500);
              die('CANNOT_OPEN_ZIP');
          }
          $zip->setPassword($providedToken);

          $extractPath = realpath(__DIR__ . '/..');
          if ($extractPath === false || !is_dir($extractPath)) {
              $zip->close();
              $cleanupStaging(false);
              http_response_code(500);
              die('INVALID_EXTRACT_PATH');
          }

          // -------------------------------------------------------------
          // VALIDASI KEAMANAN: ZIP BOMB, ZIP SLIP, STORAGE, & FILE SENSITIF
          // -------------------------------------------------------------
          $maxEntries = 25000;
          $maxSingleFileSize = 52428800;  // 50 MB
          $maxTotalSize = 524288000;      // 500 MB

          if ($zip->numFiles <= 0 || $zip->numFiles > $maxEntries) {
              $zip->close();
              $cleanupStaging(false);
              http_response_code(400);
              die('SECURITY_VALIDATION_FAILED: ENTRY_COUNT_OUT_OF_BOUNDS');
          }

          $totalUncompressedSize = 0;
          $seenZipEntries = [];
          $seenZipEntriesLower = [];
          $seenZipAncestorsLower = [];

          for ($i = 0; $i < $zip->numFiles; $i++) {
              $stat = $zip->statIndex($i);
              if ($stat === false) {
                  $zip->close();
                  $cleanupStaging(false);
                  http_response_code(400);
                  die('SECURITY_VALIDATION_FAILED: CORRUPT_ENTRY');
              }

              $size = (int)($stat['size'] ?? 0);
              if ($size > $maxSingleFileSize) {
                  $zip->close();
                  $cleanupStaging(false);
                  http_response_code(400);
                  die('SECURITY_VALIDATION_FAILED: FILE_SIZE_LIMIT_EXCEEDED');
              }

              $totalUncompressedSize += $size;
              if ($totalUncompressedSize > $maxTotalSize) {
                  $zip->close();
                  $cleanupStaging(false);
                  http_response_code(400);
                  die('SECURITY_VALIDATION_FAILED: TOTAL_SIZE_LIMIT_EXCEEDED');
              }

              $entry = (string)($stat['name'] ?? '');

              // 1. Cek null-byte injection
              if (strpos($entry, "\0") !== false) {
                  $zip->close();
                  $cleanupStaging(false);
                  http_response_code(400);
                  die('SECURITY_VALIDATION_FAILED: NULL_BYTE_DETECTED');
              }

              // 2. Cek Windows drive letter
              if (preg_match('/^[a-zA-Z]:/', $entry)) {
                  $zip->close();
                  $cleanupStaging(false);
                  http_response_code(400);
                  die('SECURITY_VALIDATION_FAILED: DRIVE_LETTER_DETECTED');
              }

              // 3. Deteksi Symbolic Link & Berkas Khusus
              $isUnixDirAttr = false;
              if ($zip->getExternalAttributesIndex($i, $opsys, $attr)) {
                  if ($opsys === ZipArchive::OPSYS_UNIX) {
                      $fileType = (($attr >> 16) & 0170000);
                      if ($fileType === 0120000 || $fileType === 0020000 || $fileType === 0060000 || $fileType === 0010000 || $fileType === 0140000) {
                          $zip->close();
                          $cleanupStaging(false);
                          http_response_code(400);
                          die('SECURITY_VALIDATION_FAILED: SPECIAL_FILE_OR_SYMLINK_DETECTED');
                      }
                      if ($fileType === 0040000) {
                          $isUnixDirAttr = true;
                      }
                  }
              }

              // 4. Normalisasi separator
              $normalized = str_replace('\\', '/', $entry);

              // 5. Tolak leading slash
              if (str_starts_with($normalized, '/')) {
                  $zip->close();
                  $cleanupStaging(false);
                  http_response_code(400);
                  die('SECURITY_VALIDATION_FAILED: ABSOLUTE_PATH');
              }

              // 6. Periksa segmen path traversal '..'
              $segments = explode('/', $normalized);
              foreach ($segments as $segment) {
                  if ($segment === '..') {
                      $zip->close();
                      $cleanupStaging(false);
                      http_response_code(400);
                      die('SECURITY_VALIDATION_FAILED: PATH_TRAVERSAL');
                  }
              }

              $cleanSegments = [];
              foreach ($segments as $s) {
                  if ($s === '' || $s === '.') {
                      continue;
                  }
                  $cleanSegments[] = $s;
              }

              if (empty($cleanSegments)) {
                  continue;
              }

              // 7. Berkas hanya diizinkan masuk ke 'ukk_rapi' atau 'public_html'
              $topDir = $cleanSegments[0];
              if ($topDir !== 'ukk_rapi' && $topDir !== 'public_html') {
                  $zip->close();
                  $cleanupStaging(false);
                  http_response_code(400);
                  die('SECURITY_VALIDATION_FAILED: INVALID_TARGET_DIR');
              }

              // 8. Perlindungan file sensitif: Larang keras ekstraksi berkas .env
              foreach ($cleanSegments as $seg) {
                  if (str_starts_with(strtolower($seg), '.env')) {
                      $zip->close();
                      $cleanupStaging(false);
                      http_response_code(400);
                      die('SECURITY_VALIDATION_FAILED: ENV_FILE_FORBIDDEN');
                  }
              }

              // 9. Larang keras paket membawa folder storage lokal (pemeriksaan berbasis segmen dinormalisasi & case-insensitive)
              $topLower = strtolower($cleanSegments[0]);
              $secondLower = isset($cleanSegments[1]) ? strtolower($cleanSegments[1]) : '';
              if (($topLower === 'ukk_rapi' && $secondLower === 'storage') ||
                  ($topLower === 'public_html' && $secondLower === 'storage') ||
                  ($topLower === 'storage')
              ) {
                  $zip->close();
                  $cleanupStaging(false);
                  http_response_code(400);
                  die('SECURITY_VALIDATION_FAILED: STORAGE_IN_PAYLOAD_FORBIDDEN');
              }

              // 10. Validasi nama entri ZIP setelah normalisasi, tolak duplikat identik, case-insensitive,
              //     konflik file vs direktori, tabrakan casing direktori induk (ancestor case collision),
              //     serta dua nama berbeda yang mengarah ke tujuan ekstraksi yang sama.
              $isDir = str_ends_with($normalized, '/') || $isUnixDirAttr;
              $targetNormalized = implode('/', $cleanSegments);
              $targetLower = strtolower($targetNormalized);
              $entryType = $isDir ? 'dir' : 'file';

              // A. Tolak duplikat identik, case-insensitive, dan dua nama yang mengarah ke target ekstraksi yang sama
              if (isset($seenZipEntriesLower[$targetLower])) {
                  $existing = $seenZipEntriesLower[$targetLower];
                  $zip->close();
                  $cleanupStaging(false);
                  http_response_code(400);
                  if ($existing['type'] !== $entryType) {
                      die("SECURITY_VALIDATION_FAILED: TYPE_CONFLICT: Konflik file vs direktori antara '{$existing['original']}' dan '$entry' (target: '$targetNormalized')");
                  }
                  if ($existing['original'] === $entry) {
                      die("SECURITY_VALIDATION_FAILED: DUPLICATE_ENTRY: Duplikat identik entri ZIP terdeteksi: '$entry'");
                  }
                  die("SECURITY_VALIDATION_FAILED: DUPLICATE_ENTRY: Duplikat entri ZIP atau path collision terdeteksi antara '{$existing['original']}' dan '$entry' (target: '$targetNormalized')");
              }

              // B. Tolak konflik file vs direktori: file tidak boleh bertabrakan dengan direktori ancestor yang sudah terdaftar
              if ($entryType === 'file') {
                  if (isset($seenZipAncestorsLower[$targetLower])) {
                      $zip->close();
                      $cleanupStaging(false);
                      http_response_code(400);
                      die("SECURITY_VALIDATION_FAILED: TYPE_CONFLICT: Berkas '$entry' berkonflik dengan direktori induk yang telah terdaftar (target: '$targetNormalized')");
                  }
              }

              // C. Tolak konflik casing direktori: jika entri ini direktori, pastikan casing cocok dengan direktori induk yang tercatat
              if ($entryType === 'dir') {
                  if (isset($seenZipAncestorsLower[$targetLower]) && $seenZipAncestorsLower[$targetLower] !== $targetNormalized) {
                      $zip->close();
                      $cleanupStaging(false);
                      http_response_code(400);
                      die("SECURITY_VALIDATION_FAILED: ANCESTOR_CASE_COLLISION: Konflik casing direktori antara '$targetNormalized' dan direktori induk '{$seenZipAncestorsLower[$targetLower]}'");
                  }
                  $seenZipAncestorsLower[$targetLower] = $targetNormalized;
              }

              // D. Validasi seluruh direktori induk (ancestor): tolak konflik file vs direktori dan tolak tabrakan casing direktori induk
              $ancestorParts = $cleanSegments;
              array_pop($ancestorParts);
              $accum = '';
              foreach ($ancestorParts as $part) {
                  $accum = ($accum === '') ? $part : ($accum . '/' . $part);
                  $accumLower = strtolower($accum);

                  // Direktori induk tidak boleh pernah terdaftar sebagai berkas reguler dan tidak boleh beda casing
                  if (isset($seenZipEntriesLower[$accumLower])) {
                      if ($seenZipEntriesLower[$accumLower]['type'] === 'file') {
                          $zip->close();
                          $cleanupStaging(false);
                          http_response_code(400);
                          die("SECURITY_VALIDATION_FAILED: TYPE_CONFLICT: Direktori induk '$accum' telah terdaftar sebagai berkas reguler");
                      }
                      if ($seenZipEntriesLower[$accumLower]['normalized'] !== $accum) {
                          $zip->close();
                          $cleanupStaging(false);
                          http_response_code(400);
                          die("SECURITY_VALIDATION_FAILED: ANCESTOR_CASE_COLLISION: Konflik casing direktori induk antara '{$seenZipEntriesLower[$accumLower]['normalized']}' dan '$accum'");
                      }
                  }

                  // Tolak dua entri dengan direktori induk yang hanya berbeda huruf kapital/kecil (case collision)
                  if (isset($seenZipAncestorsLower[$accumLower])) {
                      if ($seenZipAncestorsLower[$accumLower] !== $accum) {
                          $zip->close();
                          $cleanupStaging(false);
                          http_response_code(400);
                          die("SECURITY_VALIDATION_FAILED: ANCESTOR_CASE_COLLISION: Konflik casing direktori induk antara '{$seenZipAncestorsLower[$accumLower]}' dan '$accum' (berkas: '$entry')");
                      }
                  } else {
                      $seenZipAncestorsLower[$accumLower] = $accum;
                  }
              }

              $seenZipEntries[$targetNormalized] = ['type' => $entryType, 'original' => $entry];
              $seenZipEntriesLower[$targetLower] = ['type' => $entryType, 'original' => $entry, 'normalized' => $targetNormalized];
          }

          // Format resmi Maintenance Mode Laravel 13
          $maintenancePayload = json_encode([
              'time' => time(),
              'retry' => 15,
              'secret' => null,
              'status' => 503,
              'template' => '<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><title>Pembaruan Sistem</title><style>body{font-family:system-ui,-apple-system,sans-serif;text-align:center;padding:12% 20px;background:#f8fafc;color:#1e293b;}h1{font-size:24px;margin-bottom:8px;}p{font-size:15px;color:#64748b;}</style></head><body><h1>Sistem Sedang Diperbarui</h1><p>Mohon tunggu beberapa saat, sistem sedang menerapkan pembaruan aplikasi.</p></body></html>'
          ]);

          // Aktifkan maintenance mode sebelum menyentuh file apa pun
          if (!$wasAlreadyInMaintenance) {
              if (!is_dir($frameworkDir)) {
                  if (!mkdir($frameworkDir, 0755, true) && !is_dir($frameworkDir)) {
                      $cleanupStaging(false);
                      http_response_code(500);
                      die('MAINTENANCE_MODE_ACTIVATION_FAILED: Gagal membuat direktori storage/framework');
                  }
                  if (!chmod($frameworkDir, 0755)) {
                      $cleanupStaging(false);
                      http_response_code(500);
                      die('MAINTENANCE_MODE_ACTIVATION_FAILED: Gagal chmod direktori storage/framework');
                  }
              }
              $putDown = file_put_contents($downFile, $maintenancePayload);
              clearstatcache(true, $downFile);
              if ($putDown === false || !file_exists($downFile) || filesize($downFile) !== strlen($maintenancePayload)) {
                  if (file_exists($downFile)) {
                      $unlinked = unlink($downFile);
                      clearstatcache(true, $downFile);
                      if (!$unlinked || file_exists($downFile)) {
                          $cleanupStaging(false);
                          http_response_code(500);
                          die("MAINTENANCE_MODE_ACTIVATION_FAILED: Penulisan berkas down tidak lengkap dan gagal dibersihkan. Website mungkin masih dalam mode maintenance: $downFile");
                      }
                  }
                  $cleanupStaging(false);
                  http_response_code(500);
                  die('MAINTENANCE_MODE_ACTIVATION_FAILED: Gagal menulis berkas down secara utuh');
              }
              if (!chmod($downFile, 0644)) {
                  $cleanupStaging(false);
                  $unlinked = unlink($downFile);
                  clearstatcache(true, $downFile);
                  http_response_code(500);
                  if (!$unlinked || file_exists($downFile)) {
                      die("MAINTENANCE_MODE_ACTIVATION_FAILED: Gagal chmod berkas down dan gagal membersihkan berkas down. Website mungkin masih dalam mode maintenance: $downFile");
                  }
                  die('MAINTENANCE_MODE_ACTIVATION_FAILED: Gagal chmod berkas down. Berkas down berhasil dibersihkan kembali.');
              }
          }

          // -------------------------------------------------------------
          // CAKUPAN BACKUP MENYELURUH (COMPREHENSIVE BACKUP COVERAGE)
          // -------------------------------------------------------------
          $backupRoot = $stagingDir . '/pre_deploy_backup';
          if (!is_dir($backupRoot)) {
              if (!mkdir($backupRoot, 0755, true) && !is_dir($backupRoot)) {
                  $cleanupStaging(false);
                  http_response_code(500);
                  die('CANNOT_CREATE_BACKUP_ROOT');
              }
          }
          $backupErrors = [];

          $safeCopyFile = function (string $src, string $dst) use (&$backupErrors): bool {
              if (is_link($src)) {
                  $backupErrors[] = "Tautan symlink dilarang pada safeCopyFile: $src";
                  return false;
              }
              $srcType = @filetype($src);
              if (!is_file($src) || $srcType !== 'file') {
                  $backupErrors[] = "Berkas sumber bukan regular file (tipe: " . ($srcType ?: 'unknown') . "): $src";
                  return false;
              }
              $parent = dirname($dst);
              if (is_link($parent)) {
                  if (!unlink($parent)) {
                      $backupErrors[] = "Gagal unlink symlink parent backup: $parent";
                      return false;
                  }
              }
              if (!is_dir($parent)) {
                  if (!mkdir($parent, 0755, true) && !is_dir($parent)) {
                      $backupErrors[] = "Gagal membuat direktori induk: $parent";
                      return false;
                  }
                  if (!chmod($parent, 0755)) {
                      $backupErrors[] = "Gagal chmod direktori induk: $parent";
                      return false;
                  }
              }
              if (is_link($dst)) {
                  if (!unlink($dst)) {
                      $backupErrors[] = "Gagal unlink symlink dst sebelum copy: $dst";
                      return false;
                  }
              }
              if (!copy($src, $dst)) {
                  $backupErrors[] = "Gagal menyalin berkas: $src -> $dst";
                  return false;
              }
              if (!chmod($dst, 0644)) {
                  $backupErrors[] = "Gagal chmod berkas: $dst";
                  return false;
              }
              return true;
          };

          $safeCopyDir = function (string $src, string $dst) use (&$safeCopyDir, &$safeCopyFile, &$backupErrors): bool {
              if (is_link($dst)) {
                  if (!unlink($dst)) {
                      $backupErrors[] = "Gagal unlink symlink target sebelum membuat direktori backup: $dst";
                      return false;
                  }
              }
              if (!is_dir($dst)) {
                  if (!mkdir($dst, 0755, true) && !is_dir($dst)) {
                      $backupErrors[] = "Gagal membuat direktori: $dst";
                      return false;
                  }
                  if (!chmod($dst, 0755)) {
                      $backupErrors[] = "Gagal chmod direktori: $dst";
                      return false;
                  }
              }
              if (is_link($src)) {
                  $linkTarget = readlink($src);
                  if ($linkTarget !== false) {
                      if (file_exists($dst) || is_link($dst)) {
                          if (!unlink($dst)) {
                              $backupErrors[] = "Gagal unlink target sebelum menyalin symlink direktori: $dst";
                              return false;
                          }
                      }
                      if (!symlink($linkTarget, $dst)) {
                          $backupErrors[] = "Gagal menyalin symlink direktori: $src -> $dst";
                          return false;
                      }
                  }
                  return true;
              }
              $dh = opendir($src);
              if ($dh === false) {
                  $backupErrors[] = "Gagal membuka direktori sumber: $src";
                  return false;
              }
              $ok = true;
              while (true) {
                  error_clear_last();
                  $entry = readdir($dh);
                  if ($entry === false) {
                      $lastErr = error_get_last();
                      if ($lastErr !== null) {
                          $backupErrors[] = "Kegagalan pembacaan direktori di tengah iterasi: $src (" . $lastErr['message'] . ")";
                          $ok = false;
                      }
                      break;
                  }
                  if ($entry === '.' || $entry === '..') {
                      continue;
                  }
                  $srcPath = $src . '/' . $entry;
                  $dstPath = $dst . '/' . $entry;
                  if (is_link($srcPath)) {
                      $linkTarget = readlink($srcPath);
                      if ($linkTarget !== false) {
                          if (file_exists($dstPath) || is_link($dstPath)) {
                              if (!unlink($dstPath)) {
                                  $backupErrors[] = "Gagal unlink dstPath sebelum menyalin symlink: $dstPath";
                                  $ok = false;
                                  break;
                              }
                          }
                          if (!symlink($linkTarget, $dstPath)) {
                              $backupErrors[] = "Gagal menyalin symlink: $srcPath -> $dstPath";
                              $ok = false;
                              break;
                          }
                      }
                  } elseif (is_dir($srcPath)) {
                      if (!$safeCopyDir($srcPath, $dstPath)) {
                          $ok = false;
                          break;
                      }
                  } else {
                      $entryType = @filetype($srcPath);
                      if ($entryType !== 'file') {
                          $backupErrors[] = "Jenis filesystem khusus dilarang dalam pencadangan (tipe: " . ($entryType ?: 'unknown') . "): $srcPath";
                          $ok = false;
                          break;
                      }
                      if (!$safeCopyFile($srcPath, $dstPath)) {
                          $ok = false;
                          break;
                      }
                  }
              }
              closedir($dh);
              return $ok;
          };

          // 1. Cadangkan seluruh direktori inti yang dikelola
          $coreDirs = ['app', 'bootstrap', 'config', 'database', 'resources', 'routes', 'vendor'];
          foreach ($coreDirs as $cd) {
              $src = $ukkRapiRoot . '/' . $cd;
              $dst = $backupRoot . '/ukk_rapi/' . $cd;
              if (is_dir($src)) {
                  if (!$safeCopyDir($src, $dst)) {
                      break;
                  }
              }
          }

          // 2. Cadangkan berkas akar inti
          $coreFiles = ['artisan', 'composer.json', 'composer.lock', 'package.json'];
          foreach ($coreFiles as $cf) {
              $src = $ukkRapiRoot . '/' . $cf;
              $dst = $backupRoot . '/ukk_rapi/' . $cf;
              if (file_exists($src)) {
                  $safeCopyFile($src, $dst);
              }
          }

          // 3. Cadangkan berkas publik (build, index, htaccess, robots, favicon, info, dll.)
          if (is_dir(__DIR__ . '/build')) {
              $safeCopyDir(__DIR__ . '/build', $backupRoot . '/public_html/build');
          }
          $publicFiles = ['index.php', '.htaccess', 'robots.txt', 'favicon.ico', 'info.php'];
          foreach ($publicFiles as $pf) {
              $src = __DIR__ . '/' . $pf;
              $dst = $backupRoot . '/public_html/' . $pf;
              if (file_exists($src)) {
                  $safeCopyFile($src, $dst);
              }
          }

          // 4. Dynamic ZIP Target Discovery:
          for ($i = 0; $i < $zip->numFiles; $i++) {
              $stat = $zip->statIndex($i);
              $entryName = str_replace('\\', '/', $stat['name']);
              if (str_ends_with($entryName, '/')) {
                  continue;
              }
              $targetOnServer = $extractPath . '/' . $entryName;
              $backupTarget = $backupRoot . '/' . $entryName;
              if (file_exists($targetOnServer) && !file_exists($backupTarget)) {
                  $safeCopyFile($targetOnServer, $backupTarget);
              }
          }

          // 5. Validasi integritas & susun manifest snapshot pencadangan lengkap
          $backupManifest = [];
          if (is_dir($backupRoot)) {
              try {
                  $manifestScanIt = new RecursiveIteratorIterator(
                      new RecursiveDirectoryIterator($backupRoot, RecursiveDirectoryIterator::SKIP_DOTS),
                      RecursiveIteratorIterator::SELF_FIRST
                  );
                  foreach ($manifestScanIt as $mItem) {
                      if ($mItem->isLink()) {
                          $backupErrors[] = "Symlink dilarang dalam direktori backup (manifest scan): " . $mItem->getPathname();
                          break;
                      }
                      $rel = substr($mItem->getPathname(), strlen($backupRoot) + 1);
                      $rel = str_replace('\\', '/', $rel);
                      if ($mItem->isDir()) {
                          $backupManifest[$rel] = ['type' => 'dir'];
                      } elseif ($mItem->isFile()) {
                          $mSize = $mItem->getSize();
                          $mHash = hash_file('sha256', $mItem->getPathname());
                          if ($mSize === false || $mHash === false) {
                              $backupErrors[] = "Gagal menghitung hash/size manifest backup: " . $mItem->getPathname();
                              break;
                          }
                          $backupManifest[$rel] = [
                              'type' => 'file',
                              'size' => $mSize,
                              'hash' => $mHash,
                          ];
                      }
                  }
              } catch (\Throwable $e) {
                  $backupErrors[] = "Exception saat menyusun manifest backup: " . $e->getMessage();
              }
          }

          // Batalkan deployment sebelum ekstraksi jika backup mengalami kegagalan
          if (!empty($backupErrors)) {
              $zip->close();
              if (!$wasAlreadyInMaintenance && file_exists($downFile)) {
                  $unlinked = unlink($downFile);
                  clearstatcache(true, $downFile);
                  if (!$unlinked || file_exists($downFile)) {
                      $backupErrors[] = "Gagal melepas maintenance mode setelah kegagalan backup: $downFile";
                  }
              }
              $cleanupStaging(false);
              http_response_code(500);
              die('BACKUP_FAILED_ABORTING_DEPLOYMENT: ' . implode('; ', $backupErrors));
          }

          // -------------------------------------------------------------
          // FUNGSI ROLLBACK EXACT MIRROR & STORAGE RESTORATION (TANPA OPERATOR @)
          // -------------------------------------------------------------
          $rollbackErrors = [];

          $scanDirSafely = function (string $dir, ?string &$error = null): ?array {
              $error = null;
              if (is_link($dir)) {
                  $error = "Direktori berupa symlink (dilarang): $dir";
                  return null;
              }
              if (!is_dir($dir)) {
                  $error = "Direktori tidak ditemukan atau bukan direktori: $dir";
                  return null;
              }

              // DOKUMENTASI BATASAN TEKNIS MUTASI KONKUREN:
              // Perbandingan filemtime sebelum dan sesudah scandir() adalah mekanisme deteksi *best-effort*.
              // KETERBATASAN NYATA:
              // 1. Resolusi timestamp pada filesystem (ext3, FAT, mount tertentu) memiliki granularitas 1 detik (atau 2 detik).
              //    Perubahan berkas yang terjadi dalam detik yang sama tidak akan mengubah nilai filemtime.
              // 2. Cache stat PHP dan OS (meskipun clearstatcache dipanggil) pada networked/shared filesystem
              //    tidak selalu menjamin pembaruan mtime seketika.
              // 3. Pada Unix, mtime direktori hanya berubah ketika ada entri yang ditambah/dihapus/direname;
              //    perubahan konten pada berkas di dalamnya tidak mengubah mtime direktori induk.
              // Oleh karena itu, pemeriksaan kegagalan scandir() !== false tetap menjadi pertahanan utama
              // terhadap kegagalan pembacaan I/O direktori, sementara filemtime digunakan sebagai deteksi heuristik tambahan.
              clearstatcache(true, $dir);
              $mtimeBefore = @filemtime($dir);

              error_clear_last();
              $rawEntries = @scandir($dir);
              if ($rawEntries === false) {
                  $lastErr = error_get_last();
                  $error = "Gagal membaca direktori: $dir" . ($lastErr ? " (" . $lastErr['message'] . ")" : "");
                  return null;
              }

              clearstatcache(true, $dir);
              $mtimeAfter = @filemtime($dir);
              if ($mtimeBefore !== false && $mtimeAfter !== false && $mtimeBefore !== $mtimeAfter) {
                  $error = "Direktori berubah ketika sedang dibaca (mtime mismatch / concurrent mutation): $dir";
                  return null;
              }

              $clean = [];
              foreach ($rawEntries as $e) {
                  if ($e === '.' || $e === '..') continue;
                  $clean[] = $e;
              }
              return $clean;
          };

          $deleteRecursiveNoSymlinkFollow = function (string $target) use (&$deleteRecursiveNoSymlinkFollow, &$rollbackErrors, $scanDirSafely): bool {
              if (is_link($target) || is_file($target)) {
                  if (!unlink($target)) {
                      $rollbackErrors[] = "Gagal unlink berkas/tautan: $target";
                      return false;
                  }
                  return true;
              }
              if (is_dir($target)) {
                  $entries = $scanDirSafely($target, $err);
                  if ($entries === null) {
                      $rollbackErrors[] = "Gagal membuka direktori untuk penghapusan: $target (" . ($err ?: 'unknown') . ")";
                      return false;
                  }
                  foreach ($entries as $f) {
                      if (!$deleteRecursiveNoSymlinkFollow($target . '/' . $f)) {
                          return false;
                      }
                  }
                  if (!rmdir($target)) {
                      $rollbackErrors[] = "Gagal rmdir: $target";
                      return false;
                  }
                  return true;
              }
              return true;
          };

          $isHierarchySymlinkFree = function (string $path) use (&$rollbackErrors): bool {
              $norm = str_replace('\\', '/', $path);
              if (strpos($norm, "\0") !== false) {
                  $rollbackErrors[] = "Null-byte terdeteksi pada path: $path";
                  return false;
              }
              foreach (explode('/', $norm) as $seg) {
                  if ($seg === '..') {
                      $rollbackErrors[] = "Path traversal segmen '..' terdeteksi: $path";
                      return false;
                  }
              }
              if (!preg_match('#^([a-zA-Z]:/|/)#', $norm)) {
                  $rollbackErrors[] = "Path harus berupa path absolut: $path";
                  return false;
              }
              $curr = rtrim($norm, '/');
              while ($curr && $curr !== '/' && !preg_match('#^[a-zA-Z]:$#', $curr)) {
                  if (is_link($curr)) {
                      $rollbackErrors[] = "Symlink terdeteksi pada hierarki path (dilarang dan tidak diikuti): $curr";
                      return false;
                  }
                  $parent = dirname($curr);
                  if ($parent === $curr) break;
                  $curr = $parent;
              }
              return true;
          };

          $resolveCanonicalPathSafe = function (
              string $path,
              ?string &$error = null,
              ?string $mustBeInside = null
          ) use ($isHierarchySymlinkFree): ?string {
              $error = null;

              // 1. Tolak null byte
              if (strpos($path, "\0") !== false) {
                  $error = "Null-byte terdeteksi pada path: $path";
                  return null;
              }

              // 2. Tolak UNC path secara eksplisit
              if (str_starts_with($path, '\\\\') || str_starts_with($path, '//') || str_starts_with($path, '\\/') || str_starts_with($path, '/\\')) {
                  $error = "UNC path tidak didukung: $path";
                  return null;
              }

              // 3. Normalisasi separator awal untuk inspeksi
              $norm = str_replace('\\', '/', $path);

              // 4. Tolak Windows drive-relative path (misal: 'C:foo/bar' tanpa slash setelah titik dua)
              if (preg_match('/^[a-zA-Z]:(?!\/)/', $norm)) {
                  $error = "Windows drive-relative path tidak diizinkan: $path";
                  return null;
              }

              // 5. Tolak relative path: wajib diawali dengan '/' (Unix root) atau '[a-zA-Z]:/' (Windows drive root)
              if (!preg_match('#^([a-zA-Z]:/|/)#', $norm)) {
                  $error = "Path harus berupa path absolut: $path";
                  return null;
              }

              // 6. Tolak path traversal segmen '..'
              foreach (explode('/', $norm) as $seg) {
                  if ($seg === '..') {
                      $error = "Path traversal segmen '..' terdeteksi: $path";
                      return null;
                  }
              }

              // 7. Deteksi root path Unix atau Windows drive root sebelum duplicate slashes dihapus
              $isUnixRoot = ($norm === '/' || preg_match('#^/+$#', $norm));
              $isWindowsDriveRoot = (bool)preg_match('#^[a-zA-Z]:/+$#', $norm);

              $norm = preg_replace('#/{2,}#', '/', $norm);

              if ($isUnixRoot) {
                  $norm = '/';
              } elseif ($isWindowsDriveRoot) {
                  $norm = strtoupper(substr($norm, 0, 2)) . '/';
              } else {
                  $norm = rtrim($norm, '/');
              }

              $resultCanon = null;

              // 8. Jika path sudah ada di filesystem
              if (file_exists($norm) || is_link($norm)) {
                  if (is_link($norm)) {
                      $error = "Path berupa symlink (dilarang): $path";
                      return null;
                  }
                  $canon = realpath($norm);
                  if ($canon === false || is_link($canon)) {
                      $error = "Gagal mendapatkan canonical path atau berupa symlink: $path";
                      return null;
                  }
                  if (!$isHierarchySymlinkFree($canon)) {
                      $error = "Hierarki path mengandung symlink: $path";
                      return null;
                  }
                  $normCanon = str_replace('\\', '/', $canon);
                  if ($normCanon !== '/' && !preg_match('#^[a-zA-Z]:/$#', $normCanon)) {
                      $normCanon = rtrim($normCanon, '/');
                  }
                  $resultCanon = $normCanon;
              } else {
                  // 9. Jika path belum ada: cari ancestor terdekat yang benar-benar ada
                  $curr = $norm;
                  $tail = [];
                  while (strlen($curr) > 0 && !file_exists($curr)) {
                      $tail[] = basename($curr);
                      $parent = dirname($curr);
                      if ($parent === $curr) break;
                      $curr = $parent;
                  }

                  if (!file_exists($curr) || is_link($curr) || !is_dir($curr)) {
                      $error = "Ancestor terdekat dari path tidak valid atau berupa symlink: $curr (path: $path)";
                      return null;
                  }

                  $canonExisting = realpath($curr);
                  if ($canonExisting === false || is_link($canonExisting) || !is_dir($canonExisting)) {
                      $error = "Gagal memvalidasi canonical path ancestor yang ada: $curr";
                      return null;
                  }
                  if (!$isHierarchySymlinkFree($canonExisting)) {
                      $error = "Ancestor path mengandung symlink: $curr";
                      return null;
                  }

                  $normCanonExisting = str_replace('\\', '/', $canonExisting);
                  if ($normCanonExisting !== '/' && !preg_match('#^[a-zA-Z]:/$#', $normCanonExisting)) {
                      $normCanonExisting = rtrim($normCanonExisting, '/');
                  }

                  $tail = array_reverse($tail);
                  if ($normCanonExisting === '/') {
                      $resultCanon = '/' . implode('/', $tail);
                  } elseif (preg_match('#^[a-zA-Z]:/$#', $normCanonExisting)) {
                      $resultCanon = $normCanonExisting . implode('/', $tail);
                  } else {
                      $resultCanon = $normCanonExisting . '/' . implode('/', $tail);
                  }
              }

              // 10. Validasi containment terhadap $mustBeInside dengan boundary separator
              if ($mustBeInside !== null && $resultCanon !== null) {
                  $realMust = realpath($mustBeInside);
                  if ($realMust === false || is_link($realMust) || !is_dir($realMust)) {
                      $error = "Permitted root tidak valid atau berupa symlink: $mustBeInside";
                      return null;
                  }
                  if (!$isHierarchySymlinkFree($realMust)) {
                      $error = "Permitted root memiliki ancestor symlink: $mustBeInside";
                      return null;
                  }
                  $normMust = str_replace('\\', '/', $realMust);
                  if ($normMust !== '/' && !preg_match('#^[a-zA-Z]:/$#', $normMust)) {
                      $normMust = rtrim($normMust, '/');
                  }

                  $isInside = false;
                  if ($normMust === '/') {
                      $isInside = str_starts_with($resultCanon, '/');
                  } elseif (preg_match('#^[a-zA-Z]:/$#', $normMust)) {
                      $isInside = ($resultCanon === $normMust || str_starts_with($resultCanon, $normMust));
                  } else {
                      $isInside = ($resultCanon === $normMust || str_starts_with($resultCanon, $normMust . '/'));
                  }

                  if (!$isInside) {
                      $error = "Path kanonikal ($resultCanon) berada di luar batas permitted root ($normMust)";
                      return null;
                  }
              }

              return $resultCanon;
          };

          $prepareDirectorySafely = function (
              string $dir,
              ?string $permittedRoot = null
          ) use (
              &$rollbackErrors,
              $isHierarchySymlinkFree,
              $resolveCanonicalPathSafe
          ): bool {
              $canonPermitted = null;
              if ($permittedRoot !== null) {
                  $realRoot = realpath($permittedRoot);
                  if ($realRoot === false || is_link($realRoot) || !is_dir($realRoot)) {
                      $rollbackErrors[] = "Permitted root tidak valid atau berupa symlink: $permittedRoot";
                      return false;
                  }
                  if (!$isHierarchySymlinkFree($realRoot)) {
                      $rollbackErrors[] = "Permitted root memiliki ancestor symlink: $permittedRoot";
                      return false;
                  }
                  $canonPermitted = str_replace('\\', '/', $realRoot);
                  if ($canonPermitted !== '/' && !preg_match('#^[a-zA-Z]:/$#', $canonPermitted)) {
                      $canonPermitted = rtrim($canonPermitted, '/');
                  }
              }

              $canonTarget = $resolveCanonicalPathSafe($dir, $resolveErr, $permittedRoot);
              if ($canonTarget === null) {
                  $rollbackErrors[] = "Gagal menyelesaikan canonical target direktori: $dir (" . ($resolveErr ?: 'unknown') . ")";
                  return false;
              }

              if (file_exists($canonTarget) || is_link($canonTarget)) {
                  if (is_link($canonTarget)) {
                      $rollbackErrors[] = "Target direktori berupa symlink: $canonTarget";
                      return false;
                  }
                  if (!is_dir($canonTarget)) {
                      $rollbackErrors[] = "Target sudah ada tetapi bukan direktori: $canonTarget";
                      return false;
                  }
                  return true;
              }

              $curr = $canonTarget;
              $missingSegments = [];
              while (strlen($curr) > 0 && !file_exists($curr)) {
                  $missingSegments[] = basename($curr);
                  $parent = dirname($curr);
                  if ($parent === $curr) break;
                  $curr = $parent;
              }

              if (!file_exists($curr) || is_link($curr) || !is_dir($curr) || !$isHierarchySymlinkFree($curr)) {
                  $rollbackErrors[] = "Ancestor terdekat untuk pembuatan direktori tidak valid atau mengandung symlink: $curr";
                  return false;
              }

              $canonExisting = realpath($curr);
              if ($canonExisting === false || is_link($canonExisting) || !is_dir($canonExisting)) {
                  $rollbackErrors[] = "Gagal canonical realpath ancestor terdekat: $curr";
                  return false;
              }

              $normBuild = str_replace('\\', '/', $canonExisting);
              if ($normBuild !== '/' && !preg_match('#^[a-zA-Z]:/$#', $normBuild)) {
                  $normBuild = rtrim($normBuild, '/');
              }

              $missingSegments = array_reverse($missingSegments);

              foreach ($missingSegments as $seg) {
                  if ($seg === '' || $seg === '.' || $seg === '..') {
                      $rollbackErrors[] = "Segmen path tidak valid dalam pembuatan direktori: $seg";
                      return false;
                  }
                  if ($normBuild === '/') {
                      $normBuild = '/' . $seg;
                  } elseif (preg_match('#^[a-zA-Z]:/$#', $normBuild)) {
                      $normBuild = $normBuild . $seg;
                  } else {
                      $normBuild = $normBuild . '/' . $seg;
                  }

                  if (is_link($normBuild)) {
                      $rollbackErrors[] = "Symlink terdeteksi saat membuat hierarki direktori: $normBuild";
                      return false;
                  }

                  if (file_exists($normBuild)) {
                      if (!is_dir($normBuild)) {
                          $rollbackErrors[] = "Komponen path bukan direktori: $normBuild";
                          return false;
                      }
                  } else {
                      if (!@mkdir($normBuild, 0755)) {
                          $rollbackErrors[] = "Gagal membuat direktori (mkdir gagal): $normBuild";
                          return false;
                      }
                      if (!is_dir($normBuild) || is_link($normBuild)) {
                          $rollbackErrors[] = "Verifikasi direktori setelah mkdir gagal: $normBuild";
                          return false;
                      }
                      $realCreated = realpath($normBuild);
                      if ($realCreated === false || is_link($realCreated)) {
                          $rollbackErrors[] = "Verifikasi canonical path setelah mkdir gagal: $normBuild";
                          return false;
                      }
                      if ($canonPermitted !== null) {
                          $normCreated = str_replace('\\', '/', $realCreated);
                          $isStillInside = ($canonPermitted === '/' ? str_starts_with($normCreated, '/') :
                              (preg_match('#^[a-zA-Z]:/$#', $canonPermitted) ? str_starts_with($normCreated, $canonPermitted) :
                                  ($normCreated === $canonPermitted || str_starts_with($normCreated, $canonPermitted . '/'))));
                          if (!$isStillInside) {
                              $rollbackErrors[] = "Direktori yang baru dibuat berada di luar permitted root: $normBuild";
                              return false;
                          }
                      }
                      if (!@chmod($normBuild, 0755)) {
                          $rollbackErrors[] = "Gagal chmod direktori: $normBuild";
                          return false;
                      }
                  }
              }

              return true;
          };

          $validateAndPrepareAncestors = function (string $targetPath, string $baseRoot) use (&$rollbackErrors, $isHierarchySymlinkFree, $resolveCanonicalPathSafe, $prepareDirectorySafely): bool {
              // 1. Validasi base root: harus ada, direktori biasa, bukan symlink
              if (is_link($baseRoot) || !is_dir($baseRoot)) {
                  $rollbackErrors[] = "Base root rollback tidak valid atau merupakan symlink: $baseRoot";
                  return false;
              }
              $canonBase = realpath($baseRoot);
              if ($canonBase === false || is_link($canonBase) || !is_dir($canonBase)) {
                  $rollbackErrors[] = "Gagal memvalidasi canonical path base root: $baseRoot";
                  return false;
              }
              if (!$isHierarchySymlinkFree($canonBase)) {
                  $rollbackErrors[] = "Ancestor base root memiliki symlink: $baseRoot";
                  return false;
              }

              $normBase = str_replace('\\', '/', $canonBase);
              if ($normBase !== '/' && !preg_match('#^[a-zA-Z]:/$#', $normBase)) {
                  $normBase = rtrim($normBase, '/');
              }
              $basePrefix = ($normBase === '/' || preg_match('#^[a-zA-Z]:/$#', $normBase)) ? $normBase : ($normBase . '/');
              $normTarget = str_replace('\\', '/', $targetPath);

              if (strpos($normTarget, "\0") !== false) {
                  $rollbackErrors[] = "Null-byte terdeteksi pada target rollback: $targetPath";
                  return false;
              }
              foreach (explode('/', $normTarget) as $seg) {
                  if ($seg === '..') {
                      $rollbackErrors[] = "Path traversal '..' terdeteksi pada target rollback: $targetPath";
                      return false;
                  }
              }

              if (!preg_match('#^([a-zA-Z]:/|/)#', $normTarget)) {
                  $rollbackErrors[] = "Target rollback harus berupa path absolut: $targetPath";
                  return false;
              }

              $normTarget = preg_replace('#/{2,}#', '/', $normTarget);
              $normTarget = rtrim($normTarget, '/');

              // $basePrefix sudah dihitung aman
              if (!str_starts_with($normTarget, $basePrefix)) {
                  $rollbackErrors[] = "Target rollback berada di luar batas base root aman: $targetPath (base: $normBase)";
                  return false;
              }

              $parent = dirname($normTarget);
              $ancestors = [];
              while (strlen($parent) > strlen($normBase)) {
                  if (!str_starts_with($parent, $basePrefix)) {
                      $rollbackErrors[] = "Ancestor path keluar dari batas aman base root: $parent";
                      return false;
                  }
                  $ancestors[] = $parent;
                  $grandparent = dirname($parent);
                  if ($grandparent === $parent) break;
                  $parent = $grandparent;
              }
              $ancestors = array_reverse($ancestors);

              foreach ($ancestors as $ancestor) {
                  if (!str_starts_with($ancestor, $basePrefix)) {
                      $rollbackErrors[] = "Ancestor dilarang menyentuh atau melampaui base root: $ancestor";
                      return false;
                  }
                  if (is_link($ancestor)) {
                      $rollbackErrors[] = "Ancestor symlink terdeteksi di dalam batas target (dilarang dihapus otomatis / diikuti): $ancestor";
                      return false;
                  }
                  if (!is_dir($ancestor)) {
                      if (!mkdir($ancestor, 0755) && !is_dir($ancestor)) {
                          $rollbackErrors[] = "Gagal membuat direktori ancestor: $ancestor";
                          return false;
                      }
                      if (!chmod($ancestor, 0755)) {
                          $rollbackErrors[] = "Gagal chmod direktori ancestor: $ancestor";
                          return false;
                      }
                  }
              }
              return true;
          };

          $preflightBackupSource = function (
              string $bDir,
              ?array $manifest = null,
              string $relPrefix = '',
              array $excludedEntries = [],
              bool $requireManifest = true
          ) use (
              &$preflightBackupSource,
              &$rollbackErrors,
              $scanDirSafely,
              $isHierarchySymlinkFree,
              $resolveCanonicalPathSafe
          ): bool {
              if (is_link($bDir)) {
                  $rollbackErrors[] = "Preflight: Backup direktori berupa symlink: $bDir";
                  return false;
              }
              if (!is_dir($bDir)) {
                  $rollbackErrors[] = "Preflight: Backup direktori tidak ditemukan atau bukan direktori: $bDir";
                  return false;
              }
              if (!$isHierarchySymlinkFree($bDir)) {
                  $rollbackErrors[] = "Preflight: Backup direktori memiliki ancestor symlink: $bDir";
                  return false;
              }

              $excludedEntries = array_merge($excludedEntries, ['manifest.json']);

              // Di tingkat akar, jika $manifest null, muat dari berkas manifest.json
              if ($relPrefix === '' && $manifest === null) {
