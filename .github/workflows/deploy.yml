                      $rollbackErrors[] = "Direktori backup ukk_rapi berada di luar backupRoot: $ukkRapiBackup";
                      $allOk = false;
                  } elseif (!$isHierarchySymlinkFree($ukkRapiTarget)) {
                      $rollbackErrors[] = "Target ukk_rapi memiliki ancestor symlink: $ukkRapiTarget";
                      $allOk = false;
                  } else {
                      $ukkManifest = [];
                      if (!empty($backupManifest)) {
                          foreach ($backupManifest as $k => $v) {
                              if (str_starts_with($k, 'ukk_rapi/')) {
                                  $ukkManifest[substr($k, strlen('ukk_rapi/'))] = $v;
                              }
                          }
                      }
                      $ukkSuccess = $restoreExactDirectory($ukkRapiBackup, $ukkRapiTarget, $ukkRapiTarget, $ukkManifest);
                      if (!$ukkSuccess) {
                          $allOk = false;
                          $rollbackErrors[] = "Pemulihan wajib direktori ukk_rapi gagal";
                      }
                  }
              } else {
                  $rollbackErrors[] = "Sumber backup wajib ukk_rapi tidak ditemukan: $ukkRapiBackup";
                  $allOk = false;
              }

              // 3. Pemulihan public_html (Mengecualikan 'storage' agar symlink/direktori storage dikelola eksplisit)
              $publicBackup = $normBackupRoot . '/public_html';
              $publicTarget = dirname($storageLink);
              $canonPublicTarget = $resolveCanonicalPathSafe($publicTarget, $pubErr);
              if ($canonPublicTarget !== null) {
                  $publicTarget = $canonPublicTarget;
              }
              if (is_dir($publicBackup)) {
                  $normPubBackup = rtrim(str_replace('\\', '/', $publicBackup), '/');
                  if (!str_starts_with($normPubBackup, $normBackupRoot . '/')) {
                      $rollbackErrors[] = "Direktori backup public_html berada di luar backupRoot: $publicBackup";
                      $allOk = false;
                  } elseif (!$isHierarchySymlinkFree($publicTarget)) {
                      $rollbackErrors[] = "Target public_html memiliki ancestor symlink: $publicTarget";
                      $allOk = false;
                  } else {
                      $pubManifest = [];
                      if (!empty($backupManifest)) {
                          foreach ($backupManifest as $k => $v) {
                              if (str_starts_with($k, 'public_html/')) {
                                  $pubManifest[substr($k, strlen('public_html/'))] = $v;
                              }
                          }
                      }
                      $stagingBaseName = basename($stagingDir);
                      $pubSuccess = $restoreExactDirectory(
                          $publicBackup,
                          $publicTarget,
                          $publicTarget,
                          $pubManifest,
                          '',
                          ['storage', $stagingBaseName, 'auto_extract.php', 'deploy_payload.zip']
                      );
                      if (!$pubSuccess) {
                          $allOk = false;
                          $rollbackErrors[] = "Pemulihan wajib direktori public_html gagal";
                      }
                  }
              } else {
                  $rollbackErrors[] = "Sumber backup wajib public_html tidak ditemukan: $publicBackup";
                  $allOk = false;
              }

              // 4. Pemulihan kondisi storage awal secara eksplisit:
              if ($wasStoragePhysicalInitially) {
                  if ($storageStage === $STORAGE_STAGE_NOT_MODIFIED ||
                      $storageStage === $STORAGE_STAGE_BACKUP_IN_PROGRESS ||
                      $storageStage === $STORAGE_STAGE_BACKUP_VERIFIED ||
                      $storageStage === $STORAGE_STAGE_MIGRATION_IN_PROGRESS
                  ) {
                      // Storage fisik awal belum pernah dihapus saat migrasi.
                      // Karena restoreExactDirectory(public_html) mengecualikan 'storage',
                      // direktori fisik awal dan seluruh file unggahan pengguna di dalamnya tetap utuh tanpa modifikasi.
                      if (!is_dir($storageLink) || is_link($storageLink)) {
                          $rollbackErrors[] = "Integritas storage fisik awal terganggu sebelum migrasi selesai: $storageLink";
                          $allOk = false;
                      }
                  } elseif ($storageStage === $STORAGE_STAGE_SOURCE_REMOVED || $storageStage === $STORAGE_STAGE_SYMLINK_CREATED) {
                      // Storage fisik telah dihapus saat migrasi dan harus dipulihkan
                      if ($wasStorageEmptyPhysicalInitially) {
                          // Storage fisik awalnya adalah direktori fisik kosong: pulihkan kembali sebagai direktori fisik kosong tanpa memerlukan berkas backup
                          if (!$isHierarchySymlinkFree(dirname($storageLink))) {
                              $rollbackErrors[] = "Target storageLink memiliki ancestor symlink: $storageLink";
                              return false;
                          }
                          if (is_link($storageLink)) {
                              if (!unlink($storageLink)) {
                                  $rollbackErrors[] = "Gagal unlink symlink storage saat rollback direktori kosong: $storageLink";
                                  return false;
                              }
                          } elseif (is_dir($storageLink)) {
                              if (!$deleteRecursiveNoSymlinkFollow($storageLink)) {
                                  $rollbackErrors[] = "Gagal menghapus direktori storage lama saat rollback direktori kosong: $storageLink";
                                  return false;
                              }
                          } elseif (file_exists($storageLink)) {
                              if (!unlink($storageLink)) {
                                  $rollbackErrors[] = "Gagal unlink berkas non-link pada storageLink saat rollback: $storageLink";
                                  return false;
                              }
                          }
                          if (is_link($storageLink) || file_exists($storageLink)) {
                              $rollbackErrors[] = "storageLink masih ada sebelum pembuatan direktori fisik kosong: $storageLink";
                              return false;
                          }
                          if (!mkdir($storageLink, 0755, true) && !is_dir($storageLink)) {
                              $rollbackErrors[] = "Gagal membuat ulang direktori fisik kosong storage: $storageLink";
                              $allOk = false;
                          } elseif (!chmod($storageLink, 0755)) {
                              $rollbackErrors[] = "Gagal chmod direktori fisik kosong storage: $storageLink";
                              $allOk = false;
                          } elseif (is_link($storageLink) || !is_dir($storageLink)) {
                              $rollbackErrors[] = "storageLink bukan direktori fisik yang valid setelah pemulihan kosong: $storageLink";
                              $allOk = false;
                          } else {
                              // Pastikan direktori kosong tanpa entri liar
                              $scanEmpty = scandir($storageLink);
                              if ($scanEmpty === false) {
                                  $rollbackErrors[] = "Gagal memindai direktori fisik storage saat verifikasi rollback kosong: $storageLink";
                                  $allOk = false;
                              } else {
                                  $emptyEntries = array_diff($scanEmpty, ['.', '..']);
                                  foreach ($emptyEntries as $stray) {
                                      $strayPath = $storageLink . '/' . $stray;
                                      if (is_link($strayPath) || is_file($strayPath)) {
                                          if (!unlink($strayPath)) {
                                              $rollbackErrors[] = "Gagal menghapus berkas liar saat pemulihan direktori fisik kosong: $strayPath";
                                              $allOk = false;
                                          }
                                      } elseif (is_dir($strayPath)) {
                                          if (!$deleteRecursiveNoSymlinkFollow($strayPath)) {
                                              $rollbackErrors[] = "Gagal menghapus subdirektori liar saat pemulihan direktori fisik kosong: $strayPath";
                                              $allOk = false;
                                          }
                                      }
                                  }

                                  // Verifikasi final: pastikan direktori benar-benar terbaca dan kosong
                                  $finalScan = scandir($storageLink);
                                  if ($finalScan === false) {
                                      $rollbackErrors[] = "Gagal verifikasi final pembacaan direktori storage kosong: $storageLink";
                                      $allOk = false;
                                  } elseif (!empty(array_diff($finalScan, ['.', '..']))) {
                                      $rollbackErrors[] = "Verifikasi direktori kosong gagal: direktori masih berisi entri liar: $storageLink";
                                      $allOk = false;
                                  }
                              }
                          }
                      } elseif ($backupIsVerified === true &&
                          $physicalBackupPath &&
                          is_dir($physicalBackupPath) &&
                          !is_link($physicalBackupPath)
                      ) {
                          $canonPhysicalBackup = realpath($physicalBackupPath);
                          if ($canonPhysicalBackup === false || is_link($canonPhysicalBackup) || !is_dir($canonPhysicalBackup)) {
                              $rollbackErrors[] = "Canonical physicalBackupPath tidak valid: $physicalBackupPath";
                              return false;
                          }
                          if (!$isHierarchySymlinkFree($canonPhysicalBackup)) {
                              $rollbackErrors[] = "physicalBackupPath memiliki ancestor symlink: $physicalBackupPath";
                              return false;
                          }
                          if (!$isHierarchySymlinkFree(dirname($storageLink))) {
                              $rollbackErrors[] = "Target storageLink memiliki ancestor symlink: $storageLink";
                              return false;
                          }

                          if (is_link($storageLink)) {
                              if (!unlink($storageLink)) {
                                  $rollbackErrors[] = "Gagal unlink symlink storage saat rollback: $storageLink";
                                  return false;
                              }
                          } elseif (is_dir($storageLink)) {
                              if (!$deleteRecursiveNoSymlinkFollow($storageLink)) {
                                  return false;
                              }
                          }
                          if (is_link($storageLink)) {
                              $rollbackErrors[] = "storageLink masih berupa symlink sebelum pemulihan direktori fisik: $storageLink";
                              return false;
                          }
                          $physSuccess = $restoreExactDirectory($canonPhysicalBackup, $storageLink, $storageLink, $sourceFilesForVerify);
                          if (!$physSuccess) {
                              $allOk = false;
                              $rollbackErrors[] = "Pemulihan wajib direktori storage fisik gagal";
                          }
                      } else {
                          $rollbackErrors[] = "Tidak dapat memulihkan storage fisik: backup tidak terverifikasi atau direktori tidak ditemukan";
                          $allOk = false;
                      }
                  }
              } elseif ($wasStorageLinkInitially && $initialStorageTarget) {
                  if (!$isHierarchySymlinkFree(dirname($storageLink))) {
                      $rollbackErrors[] = "Target storageLink memiliki ancestor symlink saat pemulihan link: $storageLink";
                      return false;
                  }
                  // Karena restoreExactDirectory(public_html) mengecualikan 'storage',
                  // periksa apakah symlink sah masih ada dan mengarah ke target awal
                  $currentIsLink = is_link($storageLink);
                  $currentLinkTarget = $currentIsLink ? readlink($storageLink) : null;
                  if (!$currentIsLink || $currentLinkTarget !== $initialStorageTarget) {
                      if ($currentIsLink) {
                          if (!unlink($storageLink)) {
                              $rollbackErrors[] = "Gagal unlink symlink storage saat rollback: $storageLink";
                              $allOk = false;
                          }
                      } elseif (is_dir($storageLink)) {
                          if (!$deleteRecursiveNoSymlinkFollow($storageLink)) {
                              $allOk = false;
                          }
                      } elseif (file_exists($storageLink)) {
                          if (!unlink($storageLink)) {
                              $rollbackErrors[] = "Gagal unlink berkas non-link pada target storageLink: $storageLink";
                              $allOk = false;
                          }
                      }
                      if (!file_exists($storageLink) && !is_link($storageLink)) {
                          if (!symlink($initialStorageTarget, $storageLink)) {
                              $rollbackErrors[] = "Gagal membuat ulang symlink awal: $storageLink -> $initialStorageTarget";
                              $allOk = false;
                          }
                      }
                  }
              } else {
                  // Kondisi awal storage tidak ada (bukan symlink dan bukan direktori)
                  if (is_link($storageLink)) {
                      if (!unlink($storageLink)) {
                          $rollbackErrors[] = "Gagal unlink symlink storage tak terdaftar: $storageLink";
                          $allOk = false;
                      }
                  } elseif (is_dir($storageLink)) {
                      if (!$deleteRecursiveNoSymlinkFollow($storageLink)) {
                          $allOk = false;
                      }
                  } elseif (file_exists($storageLink)) {
                      if (!unlink($storageLink)) {
                          $rollbackErrors[] = "Gagal unlink berkas storage tak terdaftar: $storageLink";
                          $allOk = false;
                      }
                  }
              }

              if (!empty($rollbackErrors)) {
                  $allOk = false;
              }
              return $allOk;
          };

          // Helper penanganan kegagalan terpadu: Rollback menyeluruh & pemulihan konsisten status maintenance
          $deployCompleted = false;
          $handleFailureAndRollback = function (string $failureCode, string $failureReason = '') use (
              $restoreAll,
              $cleanupStaging,
              &$rollbackErrors,
              $downFile,
              $wasAlreadyInMaintenance,
              $maintenancePayload,
              &$deployCompleted
          ) {
              $deployCompleted = true; // Cegah pemanggilan ganda dari fungsi shutdown
              $restoreSuccess = $restoreAll();
              $cleanupStaging(true);

              if ($restoreSuccess && empty($rollbackErrors)) {
                  if (!$wasAlreadyInMaintenance) {
                      if (file_exists($downFile)) {
                          $unlinked = unlink($downFile);
                          clearstatcache(true, $downFile);
                          if (!$unlinked || file_exists($downFile)) {
                              $restoreSuccess = false;
                              $rollbackErrors[] = "Gagal memverifikasi pelepasan maintenance mode saat rollback: $downFile";
                          }
                      }
                  } else {
                      // Website awalnya memang maintenance: pastikan berkas down tetap ada & valid
                      clearstatcache(true, $downFile);
                      if (!file_exists($downFile)) {
                          $putDown = file_put_contents($downFile, $maintenancePayload);
                          $chmodDown = ($putDown !== false) ? chmod($downFile, 0644) : false;
                          clearstatcache(true, $downFile);
                          if ($putDown === false || !$chmodDown || !file_exists($downFile)) {
                              $restoreSuccess = false;
                              $rollbackErrors[] = "Gagal memulihkan status maintenance awal (gagal menulis berkas down): $downFile";
                          }
                      }
                  }
              } else {
                  // Rollback gagal: demi keamanan pertahankan status maintenance
                  clearstatcache(true, $downFile);
                  if (!file_exists($downFile)) {
                      $putDown = file_put_contents($downFile, $maintenancePayload);
                      $chmodDown = ($putDown !== false) ? chmod($downFile, 0644) : false;
                      clearstatcache(true, $downFile);
                      if ($putDown === false || !$chmodDown || !file_exists($downFile)) {
                          $rollbackErrors[] = "Gagal mempertahankan mode maintenance setelah rollback gagal (gagal menulis berkas down): $downFile";
                      }
                  }
              }

              http_response_code(500);
              $errDetails = !empty($rollbackErrors) ? ' (Rollback errors: ' . implode('; ', $rollbackErrors) . ')' : '';
              $rollbackStatus = ($restoreSuccess && empty($rollbackErrors)) ? ' [ROLLBACK_SUCCESSFUL]' : ' [ROLLBACK_FAILED]';
              $message = $failureCode . ($failureReason !== '' ? ": $failureReason" : '') . $rollbackStatus . $errDetails;
              die($message);
          };

          // Daftarkan shutdown function untuk menangani kematian proses mendadak / timeout (HTTP 504/508 / max_execution_time)
          register_shutdown_function(function () use (&$deployCompleted, $handleFailureAndRollback) {
              if (!$deployCompleted) {
                  $err = error_get_last();
                  $reason = $err ? ($err['message'] . ' in ' . $err['file'] . ':' . $err['line']) : 'Script terminated unexpectedly (Timeout/Killed by Web Server)';
                  $handleFailureAndRollback('FATAL_SHUTDOWN', $reason);
              }
          });

          // -------------------------------------------------------------
          // EKSTRAKSI ZIP, MIGRASI STORAGE, DAN VERIFIKASI APLIKASI
          // -------------------------------------------------------------
          try {
              $extracted = $zip->extractTo($extractPath);
              $zip->close();

              if ($extracted === TRUE) {
                  // 1. Pastikan seluruh struktur direktori writable Laravel tetap tersedia
                  $requiredWritableDirs = [
                      $ukkRapiRoot . '/storage/app/public',
                      $ukkRapiRoot . '/storage/framework/cache/data',
                      $ukkRapiRoot . '/storage/framework/sessions',
                      $ukkRapiRoot . '/storage/framework/views',
                      $ukkRapiRoot . '/storage/logs',
                      $ukkRapiRoot . '/bootstrap/cache',
                  ];
                  foreach ($requiredWritableDirs as $reqDir) {
                      if (!is_dir($reqDir)) {
                          if (!mkdir($reqDir, 0775, true) && !is_dir($reqDir)) {
                              $handleFailureAndRollback('DIRECTORY_CREATION_FAILED', "Gagal membuat direktori writable $reqDir");
                          }
                          if (!chmod($reqDir, 0775)) {
                              $handleFailureAndRollback('DIRECTORY_CREATION_FAILED', "Gagal chmod direktori writable $reqDir");
                          }
                      }
                  }

                  // 2. MIGRASI AMAN public_html/storage FISIK KE STORAGE LARAVEL
                  $relativeTarget = '../ukk_rapi/storage/app/public';
                  $appPublicDir = $ukkRapiRoot . '/storage/app/public';

                  if (is_dir($storageLink) && !is_link($storageLink)) {
                      $items = array_diff(scandir($storageLink) ?: [], ['.', '..']);
                      if (!empty($items)) {
                          // A. Validasi realpath dan tolak SELURUH symlink di dalam storage fisik demi keamanan maksimal
                          $realStorageSource = realpath($storageLink);
                          if ($realStorageSource === false || !is_dir($realStorageSource)) {
                              $handleFailureAndRollback('STORAGE_MIGRATION_FAILED', 'Gagal memvalidasi realpath direktori penyimpanan fisik sumber.');
                          }

                          $safeSourcePrefix = rtrim($realStorageSource, '/\\') . DIRECTORY_SEPARATOR;

                          try {
                              $itCheck = new RecursiveIteratorIterator(
                                  new RecursiveDirectoryIterator($storageLink, RecursiveDirectoryIterator::SKIP_DOTS),
                                  RecursiveIteratorIterator::SELF_FIRST
                              );
                              foreach ($itCheck as $checkItem) {
                                  if ($checkItem->isLink()) {
                                      $handleFailureAndRollback('STORAGE_MIGRATION_FAILED', 'Symlink dilarang berada di dalam storage fisik: ' . $checkItem->getPathname());
                                  }
                              }
                          } catch (\Throwable $e) {
                              $handleFailureAndRollback('STORAGE_MIGRATION_FAILED', 'Gagal memindai direktori penyimpanan fisik: ' . $e->getMessage());
                          }

                          $storageStage = $STORAGE_STAGE_BACKUP_IN_PROGRESS;

                          // B. Buat cadangan penuh di luar document root dengan nama unik bebas tabrakan
                          $backupCounter = 0;
                          do {
                              $backupEntropy = bin2hex(random_bytes(4));
                              $physicalBackupPath = $hostingRoot . '/storage_physical_backup_' . date('Ymd_His') . '_' . $backupEntropy . ($backupCounter > 0 ? '_' . $backupCounter : '');
                              $backupCounter++;
                          } while (file_exists($physicalBackupPath) || is_link($physicalBackupPath));

                          $backupOk = true;
                          $backupErrorsList = [];
                          $copyPhysical = function ($s, $d) use (&$copyPhysical, &$backupOk, &$backupErrorsList) {
                              try {
                                  if (is_link($d)) {
                                      if (!unlink($d)) {
                                          $backupOk = false;
                                          $backupErrorsList[] = "Gagal unlink symlink target backup: $d";
                                          return;
                                      }
                                  }
                                  if (!is_dir($d)) {
                                      if (!mkdir($d, 0755, true) && !is_dir($d)) {
                                          $backupOk = false;
                                          $backupErrorsList[] = "Gagal mkdir backup storage: $d";
                                          return;
                                      }
                                      if (!chmod($d, 0755)) {
                                          $backupOk = false;
                                          $backupErrorsList[] = "Gagal chmod backup storage: $d";
                                          return;
                                      }
                                  }
                                  if (is_link($s)) {
                                      $backupOk = false;
                                      $backupErrorsList[] = "Symlink dilarang dalam storage fisik: $s";
                                      return;
                                  }

                                  // Validasi tipe entri sumber: HANYA izinkan direktori biasa
                                  $sourceType = @filetype($s);
                                  if ($sourceType !== 'dir') {
                                      $backupOk = false;
                                      $backupErrorsList[] = "Entri sumber bukan direktori biasa (tipe: " . ($sourceType ?: 'unknown') . "): $s";
                                      return;
                                  }

                                  $dh = opendir($s);
                                  if ($dh === false) {
                                      $backupOk = false;
                                      $backupErrorsList[] = "Gagal opendir storage sumber: $s";
                                      return;
                                  }

                                  while (true) {
                                      error_clear_last();
                                      $f = readdir($dh);
                                      if ($f === false) {
                                          $lastErr = error_get_last();
                                          if ($lastErr !== null) {
                                              $backupOk = false;
                                              $backupErrorsList[] = "Kegagalan pembacaan direktori di tengah iterasi: $s (" . $lastErr['message'] . ")";
                                          }
                                          // Akhir pembacaan direktori
                                          break;
                                      }
                                      if ($f === '.' || $f === '..') continue;
                                      $sp = $s . '/' . $f;
                                      $dp = $d . '/' . $f;

                                      if (is_link($sp)) {
                                          $backupOk = false;
                                          $backupErrorsList[] = "Symlink dilarang dalam storage fisik: $sp";
                                          break;
                                      }

                                      // Tolak jenis filesystem khusus: FIFO, socket, block/char device, dll.
                                      $entryType = @filetype($sp);
                                      if ($entryType !== 'file' && $entryType !== 'dir') {
                                          $backupOk = false;
                                          $backupErrorsList[] = "Jenis filesystem khusus dilarang (tipe: " . ($entryType ?: 'unknown') . "): $sp";
                                          break;
                                      }

                                      if (is_dir($sp)) {
                                          $copyPhysical($sp, $dp);
                                          if (!$backupOk) break;
                                      } elseif (is_file($sp) && $entryType === 'file') {
                                          if (is_link($dp)) {
                                              if (!unlink($dp)) {
                                                  $backupOk = false;
                                                  $backupErrorsList[] = "Gagal unlink symlink berkas backup: $dp";
                                                  break;
                                              }
                                          }
                                          if (!copy($sp, $dp)) {
                                              $backupOk = false;
                                              $backupErrorsList[] = "Gagal copy file backup: $sp -> $dp";
                                              break;
                                          }
                                          if (!chmod($dp, 0644)) {
                                              $backupOk = false;
                                              $backupErrorsList[] = "Gagal chmod file backup: $dp";
                                              break;
                                          }
                                      } else {
                                          $backupOk = false;
                                          $backupErrorsList[] = "Entri bukan regular file maupun direktori: $sp";
                                          break;
                                      }
                                  }
                                  closedir($dh);
                              } catch (\Throwable $e) {
                                  $backupOk = false;
                                  $backupErrorsList[] = "Exception pada copyPhysical: " . $e->getMessage();
                              }
                          };
                          // Hardening Root Backup: Pastikan path tujuan belum ada dan bukan symlink
                          if (file_exists($physicalBackupPath) || is_link($physicalBackupPath)) {
                              $handleFailureAndRollback('STORAGE_BACKUP_FAILED', "Path cadangan fisik sudah ada atau berupa symlink: $physicalBackupPath");
                          }

                          $copyPhysical($storageLink, $physicalBackupPath);

                          // Hardening Root Backup: Pastikan setelah salin, root backup benar-benar sebuah direktori biasa dan bukan symlink
                          if (is_link($physicalBackupPath) || !is_dir($physicalBackupPath)) {
                              $backupOk = false;
                              $backupErrorsList[] = "Root direktori cadangan tidak valid atau merupakan symlink setelah salin: $physicalBackupPath";
                          }

                          if (!$backupOk) {
                              $handleFailureAndRollback('STORAGE_BACKUP_FAILED', implode('; ', $backupErrorsList));
                          }

                          // B.2. Verifikasi Integritas Cadangan Fisik Dua Arah (Bi-directional Verification)
                          $backupVerified = true;
                          $backupVerifyReason = '';

                          $sourceFilesForVerify = [];
                          $sourceDirsForVerify = [];
                          try {
                              $itSourceScan = new RecursiveIteratorIterator(
                                  new RecursiveDirectoryIterator($storageLink, RecursiveDirectoryIterator::SKIP_DOTS),
                                  RecursiveIteratorIterator::SELF_FIRST
                              );
                              foreach ($itSourceScan as $sItem) {
                                  $relPath = substr($sItem->getPathname(), strlen($storageLink) + 1);
                                  $relPath = str_replace('\\', '/', $relPath);
                                  if ($sItem->isLink()) {
                                      $backupVerified = false;
                                      $backupVerifyReason = "Ditemukan symlink di dalam storage sumber: $relPath";
                                      break;
                                  }
                                  if ($sItem->isDir()) {
                                      $sourceDirsForVerify[$relPath] = true;
                                      $sourceFilesForVerify[$relPath] = ['type' => 'dir'];
                                  } else {
                                      $itemRealPath = $sItem->getRealPath();
                                      if ($itemRealPath === false || !file_exists($itemRealPath)) {
                                          $backupVerified = false;
                                          $backupVerifyReason = "Gagal membaca realpath berkas sumber: " . $sItem->getPathname();
                                          break;
                                      }
                                      $itemHash = hash_file('sha256', $itemRealPath);
                                      if ($itemHash === false) {
                                          $backupVerified = false;
                                          $backupVerifyReason = "Gagal menghitung hash SHA-256 sumber: " . $itemRealPath;
                                          break;
                                      }
                                      $itemSize = @filesize($itemRealPath);
                                      if ($itemSize === false) {
                                          $backupVerified = false;
                                          $backupVerifyReason = "Gagal membaca ukuran berkas sumber: " . $itemRealPath;
                                          break;
                                      }
                                      $sourceFilesForVerify[$relPath] = [
                                          'type' => 'file',
                                          'size' => $itemSize,
                                          'hash' => $itemHash,
                                      ];
                                  }
                              }
                          } catch (\Throwable $e) {
                              $backupVerified = false;
                              $backupVerifyReason = "Exception saat memindai direktori sumber: " . $e->getMessage();
                          }

                          // 1. Verifikasi arah maju: Semua direktori sumber harus ada di backup
                          if ($backupVerified) {
                              foreach ($sourceDirsForVerify as $rDir => $dummy) {
                                  $bDirPath = $physicalBackupPath . '/' . $rDir;
                                  if (is_link($bDirPath) || !is_dir($bDirPath)) {
                                      $backupVerified = false;
                                      $backupVerifyReason = "Direktori cadangan tidak sesuai struktur sumber atau merupakan tautan: $bDirPath";
                                      break;
                                  }
                              }
                          }

                          // 2. Verifikasi arah maju: Semua berkas sumber harus ada, cocok ukuran & SHA-256
                          if ($backupVerified) {
                              foreach ($sourceFilesForVerify as $rel => $meta) {
                                  $backupFilePath = $physicalBackupPath . '/' . $rel;
                                  if (is_link($backupFilePath) || !file_exists($backupFilePath) || !is_file($backupFilePath)) {
                                      $backupVerified = false;
                                      $backupVerifyReason = "Berkas cadangan tidak ditemukan atau bukan berkas reguler: $backupFilePath";
                                      break;
                                  }
                                  $bSize = @filesize($backupFilePath);
                                  if ($bSize === false || $bSize !== $meta['size']) {
                                      $backupVerified = false;
                                      $backupVerifyReason = "Ukuran berkas cadangan tidak cocok: $backupFilePath (sumber: {$meta['size']}, cadangan: " . ($bSize === false ? 'Gagal' : $bSize) . ")";
                                      break;
                                  }
                                  $bHash = @hash_file('sha256', $backupFilePath);
                                  if ($bHash === false || $bHash !== $meta['hash']) {
                                      $backupVerified = false;
                                      $backupVerifyReason = "Hash SHA-256 berkas cadangan tidak cocok atau gagal dihitung: $backupFilePath";
                                      break;
                                  }
                              }
                          }

                          // 3. Verifikasi arah balik (Reverse verification): Pastikan root bukan symlink dan TIDAK ADA file/folder liar tambahan atau symlink di backup
                          if ($backupVerified) {
                              if (is_link($physicalBackupPath) || !is_dir($physicalBackupPath)) {
                                  $backupVerified = false;
                                  $backupVerifyReason = "Root direktori cadangan tidak valid atau merupakan symlink sebelum iterator dibuka: $physicalBackupPath";
                              } else {
                                  try {
                                      $itBackupScan = new RecursiveIteratorIterator(
                                          new RecursiveDirectoryIterator($physicalBackupPath, RecursiveDirectoryIterator::SKIP_DOTS),
                                          RecursiveIteratorIterator::SELF_FIRST
                                      );
                                      foreach ($itBackupScan as $bItem) {
                                          $relBPath = substr($bItem->getPathname(), strlen($physicalBackupPath) + 1);
                                          $relBPath = str_replace('\\', '/', $relBPath);
                                          if ($bItem->isLink()) {
                                              $backupVerified = false;
                                              $backupVerifyReason = "Symlink dilarang berada di dalam direktori cadangan: $relBPath";
                                              break;
                                          }
                                          if ($bItem->isDir()) {
                                              if (!isset($sourceDirsForVerify[$relBPath])) {
                                                  $backupVerified = false;
                                                  $backupVerifyReason = "Ditemukan direktori tambahan tak dikenal di dalam cadangan: $relBPath";
                                                  break;
                                              }
                                          } else {
                                              if (!isset($sourceFilesForVerify[$relBPath])) {
                                                  $backupVerified = false;
                                                  $backupVerifyReason = "Ditemukan berkas tambahan tak dikenal di dalam cadangan: $relBPath";
                                                  break;
                                              }
                                          }
                                      }
                                  } catch (\Throwable $e) {
                                      $backupVerified = false;
                                      $backupVerifyReason = "Exception saat memindai direktori cadangan: " . $e->getMessage();
                                  }
                              }
                          }

                          if (!$backupVerified) {
                              $handleFailureAndRollback('STORAGE_BACKUP_VERIFICATION_FAILED', "$backupVerifyReason. Deployment dibatalkan.");
                          }

                          // Tandai bahwa backup telah berhasil diverifikasi secara penuh
                          $storageStage = $STORAGE_STAGE_BACKUP_VERIFIED;
                          $backupIsVerified = true;

                          // C. Inventarisasi berkas sumber: catat relative path, size, dan SHA-256
                          $storageStage = $STORAGE_STAGE_MIGRATION_IN_PROGRESS;
                          $sourceCatalog = [];
                          try {
                              $itCatalog = new RecursiveIteratorIterator(
                                  new RecursiveDirectoryIterator($storageLink, RecursiveDirectoryIterator::SKIP_DOTS)
                              );
                              foreach ($itCatalog as $sFile) {
                                  if ($sFile->isDir()) continue;
                                  $rel = substr($sFile->getPathname(), strlen($storageLink) + 1);
                                  $rel = str_replace('\\', '/', $rel);
                                  $fullPath = $sFile->getRealPath();
                                  if ($fullPath === false || !file_exists($fullPath)) {
                                      $handleFailureAndRollback('STORAGE_MIGRATION_FAILED', "Gagal membaca realpath berkas sumber: " . $sFile->getPathname());
                                  }
                                  $fileHash = hash_file('sha256', $fullPath);
                                  if ($fileHash === false) {
                                      $handleFailureAndRollback('STORAGE_MIGRATION_FAILED', "Gagal menghitung SHA-256 untuk: $fullPath");
                                  }
                                  $fileSize = @filesize($fullPath);
                                  if ($fileSize === false) {
                                      $handleFailureAndRollback('STORAGE_MIGRATION_FAILED', "Gagal membaca ukuran berkas untuk: $fullPath");
                                  }
                                  $sourceCatalog[] = [
                                      'rel' => $rel,
                                      'full' => $fullPath,
                                      'size' => $fileSize,
                                      'hash' => $fileHash,
                                      'destTarget' => null,
                                  ];
                              }
                          } catch (\Throwable $e) {
                              $handleFailureAndRollback('STORAGE_MIGRATION_FAILED', "Exception saat katalogisasi berkas sumber: " . $e->getMessage());
                          }

                          // D. Migrasi berkas dengan deteksi konflik nama berulang
                          foreach ($sourceCatalog as &$sourceItem) {
                              $destTarget = $appPublicDir . '/' . $sourceItem['rel'];

                              if (file_exists($destTarget)) {
                                  $existingHash = hash_file('sha256', $destTarget);
                                  if ($existingHash === $sourceItem['hash']) {
                                      $sourceItem['destTarget'] = $destTarget;
                                      continue;
                                  }
                                  // Konflik nama: counter unik agar tidak pernah menimpa file legacy lama
                                  $info = pathinfo($destTarget);
                                  $conflictIndex = 1;
                                  do {
                                      $legacyPath = $info['dirname'] . '/' . $info['filename'] . '_legacy_' . date('Ymd_His') . '_' . $conflictIndex . '.' . ($info['extension'] ?? '');
                                      $conflictIndex++;
                                  } while (file_exists($legacyPath));

                                  $destTarget = $legacyPath;
                              }

                              $destDir = dirname($destTarget);
                              if (!is_dir($destDir)) {
                                  if (!mkdir($destDir, 0775, true) && !is_dir($destDir)) {
                                      $handleFailureAndRollback('STORAGE_MIGRATION_FAILED', "Gagal membuat folder tujuan: $destDir");
                                  }
                                  if (!chmod($destDir, 0775)) {
                                      $handleFailureAndRollback('STORAGE_MIGRATION_FAILED', "Gagal chmod folder tujuan: $destDir");
                                  }
                              }

                              if (!copy($sourceItem['full'], $destTarget)) {
                                  $handleFailureAndRollback('STORAGE_MIGRATION_FAILED', "Gagal menyalin berkas migrasi: {$sourceItem['full']} -> $destTarget");
                              }
                              if (!chmod($destTarget, 0644)) {
                                  $handleFailureAndRollback('STORAGE_MIGRATION_FAILED', "Gagal chmod berkas migrasi: $destTarget");
                              }
                              $sourceItem['destTarget'] = $destTarget;
                          }
                          unset($sourceItem);

                          // E. Verifikasi Integritas Ulang SHA-256 Seluruh Berkas Hasil Migrasi
                          $migrationVerified = true;
                          $mismatchReason = '';
                          foreach ($sourceCatalog as $srcCheck) {
                              $assignedDest = $srcCheck['destTarget'];
                              if (!$assignedDest || !file_exists($assignedDest)) {
                                  $migrationVerified = false;
                                  $mismatchReason = "Berkas tujuan tidak ditemukan: " . ($assignedDest ?: $srcCheck['rel']);
                                  break;
                              }
                              $destSize = filesize($assignedDest);
                              if ($destSize !== $srcCheck['size']) {
                                  $migrationVerified = false;
                                  $mismatchReason = "Ukuran berkas tidak cocok untuk: $assignedDest (sumber: {$srcCheck['size']}, tujuan: $destSize)";
                                  break;
                              }
                              $destHash = hash_file('sha256', $assignedDest);
                              if ($destHash !== $srcCheck['hash']) {
                                  $migrationVerified = false;
                                  $mismatchReason = "SHA-256 hash tidak cocok untuk: $assignedDest";
                                  break;
                              }
                          }

                          if (!$migrationVerified) {
                              $handleFailureAndRollback('STORAGE_INTEGRITY_CHECK_FAILED', "$mismatchReason. Deployment dibatalkan.");
                          }

                          // F. Hapus direktori fisik lama HANYA setelah seluruh verifikasi hash berhasil
                          $storageStage = $STORAGE_STAGE_SOURCE_REMOVED;
                          $deleteRecursiveNoSymlinkFollow($storageLink);
                          if (file_exists($storageLink) || is_link($storageLink)) {
                              $handleFailureAndRollback('STORAGE_CLEANUP_FAILED', "Direktori fisik storage lama gagal dihapus setelah migrasi [stage: $storageStage]. Deployment dibatalkan.");
                          }
                      } else {
                          if (!rmdir($storageLink)) {
                              $handleFailureAndRollback('STORAGE_CLEANUP_FAILED', "Gagal menghapus folder fisik kosong: $storageLink [stage: $storageStage]");
                          }
                          $storageStage = $STORAGE_STAGE_SOURCE_REMOVED;
                      }
                  }

                  // 3. Buat dan Verifikasi Symbolic Link public_html/storage (TANPA OPERATOR @)
                  $storageStage = $STORAGE_STAGE_SYMLINK_CREATED;
                  if (!is_link($storageLink) && !file_exists($storageLink)) {
                      if (!symlink($relativeTarget, $storageLink)) {
                          $handleFailureAndRollback('SYMLINK_FAILED', 'Gagal membuat symbolic link storage. Deployment dibatalkan.');
                      }
                  } elseif (is_link($storageLink)) {
                      if (readlink($storageLink) !== $relativeTarget) {
                          if (!unlink($storageLink)) {
                              $handleFailureAndRollback('SYMLINK_FAILED', 'Gagal menghapus symlink usang. Deployment dibatalkan.');
                          }
                          if (!symlink($relativeTarget, $storageLink)) {
                              $handleFailureAndRollback('SYMLINK_FAILED', 'Gagal memperbarui symbolic link storage. Deployment dibatalkan.');
                          }
                      }
                  }

                  // Verifikasi akhir symlink: Wajib valid
                  if (!is_link($storageLink) || readlink($storageLink) !== $relativeTarget) {
                      $handleFailureAndRollback('SYMLINK_VERIFICATION_FAILED', 'Symbolic link public/storage tidak valid. Deployment dibatalkan.');
                  }

                  // 4. Verifikasi berkas aplikasi hasil ekstraksi sebelum membuka maintenance mode
                  if (!file_exists(__DIR__ . '/index.php') || !file_exists($ukkRapiRoot . '/bootstrap/app.php') || !is_dir($ukkRapiRoot . '/vendor')) {
                      $handleFailureAndRollback('APPLICATION_INTEGRITY_VERIFICATION_FAILED', 'Berkas inti tidak lengkap setelah ekstraksi. Rollback telah dijalankan.');
                  }

                  // 5. Buka maintenance mode HANYA jika bukan maintenance pra-deployment dari Admin
                  if (!$wasAlreadyInMaintenance && file_exists($downFile)) {
                      $unlinked = unlink($downFile);
                      clearstatcache(true, $downFile);
                      if (!$unlinked || file_exists($downFile)) {
                          $handleFailureAndRollback('MAINTENANCE_MODE_DEACTIVATION_FAILED', 'Gagal menghapus berkas down saat finalisasi.');
                      }
                  }

                  // 6. Verifikasi akhir sebelum DEPLOY_SUCCESS: Pastikan website tidak dalam mode maintenance tanpa izin
                  clearstatcache(true, $downFile);
                  if (!$wasAlreadyInMaintenance && file_exists($downFile)) {
                      $handleFailureAndRollback('DEPLOYMENT_VERIFICATION_FAILED', 'Website masih dalam mode maintenance.');
                  }

                  // 7. Bersihkan berkas staging & backup karena ekstraksi dan verifikasi berhasil sempurna
                  $cleanupStaging(false);

                  if (function_exists('opcache_reset')) {
                      opcache_reset();
                  }

                  $deployCompleted = true;
                  echo "DEPLOY_SUCCESS";
              } else {
                  // Ekstraksi gagal: Lakukan rollback dan tangani status maintenance secara aman
                  $handleFailureAndRollback('EXTRACT_FAILED', 'Gagal mengekstrak berkas ZIP payload');
              }
          } catch (\Throwable $e) {
              if (is_resource($zip) || $zip instanceof ZipArchive) {
                  $zip->close();
              }
              $handleFailureAndRollback('EXTRACT_EXCEPTION', $e->getMessage());
          }
          EOF

          # Gantikan placeholder dengan hash SHA-256 yang aman
          sed -i "s/__EXPECTED_TOKEN_HASH__/${TOKEN_HASH}/g" deploy_package/public_html/auto_extract.php

          # 7. Compress menjadi 1 berkas payload deploy_payload.zip (tanpa storage lokal)
          cd deploy_package
          zip -P "$DEPLOY_TOKEN" -rq ../deploy_payload.zip ukk_rapi public_html
          cd ..

          # 8. Siapkan berkas probe unik untuk pengujian proteksi staging HTTP 403 langsung ke file
          PROBE_ID=$(php -r 'echo bin2hex(random_bytes(8));')
          PROBE_FILENAME="probe_${PROBE_ID}.txt"
          echo "PROBE_FILENAME=${PROBE_FILENAME}" >> $GITHUB_ENV

          # 9. Tahap 1: Folder pelindung staging (.htaccess pelindung, berkas probe unik, & auto_extract.php)
          mkdir -p ftp_stage1_shield/.deploy_staging
          cat << 'HTACCESS_EOF' > ftp_stage1_shield/.deploy_staging/.htaccess
          <IfModule mod_authz_core.c>
              Require all denied
          </IfModule>
          <IfModule !mod_authz_core.c>
              Order deny,allow
              Deny from all
          </IfModule>
          HTACCESS_EOF

          echo "STAGING_SHIELD_PROBE_ACTIVE" > "ftp_stage1_shield/.deploy_staging/${PROBE_FILENAME}"
          cp deploy_package/public_html/auto_extract.php ftp_stage1_shield/

          # 10. Tahap 2: Folder payload (Menyertakan auto_extract.php & .htaccess agar TIDAK dihapus oleh sinkronisasi FTP)
          mkdir -p ftp_stage2_payload/.deploy_staging
          cp ftp_stage1_shield/.deploy_staging/.htaccess ftp_stage2_payload/.deploy_staging/
          cp deploy_package/public_html/auto_extract.php ftp_stage2_payload/
          mv deploy_payload.zip ftp_stage2_payload/.deploy_staging/

      - name: "🛡️ Stage 1: Upload Protection Shield via FTP"
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./ftp_stage1_shield/
          server-dir: /public_html/

      - name: "🔍 Verify Staging Shield Active (HTTP 403 on Probe File)"
        run: |
          PROBE_URL="https://ahmad-rapi.web.id/.deploy_staging/${PROBE_FILENAME}"
          echo "Memverifikasi proteksi HTTP staging melalui berkas probe spesifik: ${PROBE_URL}"

          PROBE_HTTP_CODE=$(curl --silent -o /dev/null -w "%{http_code}" \
            --proto "=https" \
            --proto-redir "=https" \
            --location \
            --connect-timeout 15 \
            --max-time 30 \
            "${PROBE_URL}")

          echo "HTTP Response Code untuk berkas probe: ${PROBE_HTTP_CODE}"

          if [ "${PROBE_HTTP_CODE}" = "200" ]; then
            echo "::error::KEGAGALAN KEAMANAN FATAL! Berkas probe dapat diakses publik (HTTP 200 OK). Aturan .htaccess tidak aktif di hosting. Upload payload dibatalkan demi keamanan."
            exit 1
          elif [ "${PROBE_HTTP_CODE}" = "404" ]; then
            echo "::error::Pengujian tidak valid: Berkas probe tidak ditemukan di hosting (HTTP 404). Kemungkinan upload Stage 1 gagal. Upload dibatalkan."
            exit 1
          elif [ "${PROBE_HTTP_CODE}" != "403" ]; then
            echo "::error::Folder staging belum terlindungi secara benar! Server merespons HTTP ${PROBE_HTTP_CODE} (wajib HTTP 403 Forbidden). Upload dibatalkan."
            exit 1
          fi

          echo "✅ Proteksi shield .deploy_staging terverifikasi aktif (HTTP 403 Forbidden pada akses berkas langsung)."

      - name: "📦 Stage 2: Upload Payload ZIP via FTP"
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./ftp_stage2_payload/
          server-dir: public_html/

      - name: "⚡ Stage 3: Trigger Secure Extraction on cPanel"
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          echo "Extracting payload on server via secure HTTPS POST..."

          if [ -z "$DEPLOY_TOKEN" ]; then
            echo "::error::Secret DEPLOY_TOKEN tidak ditemukan pada runner. Ekstraksi dibatalkan."
            exit 1
          fi

          set +e
          RESPONSE=$(curl --silent --show-error --fail-with-body \
            --proto "=https" \
            --proto-redir "=https" \
            --location \
            --connect-timeout 30 \
            --max-time 180 \
            --request POST \
            --data-urlencode "token=${DEPLOY_TOKEN}" \
           "[https://ahmad-rapi.web.id/.deploy_staging/auto_extract.php](https://ahmad-rapi.web.id/.deploy_staging/auto_extract.php)"
          CURL_STATUS=$?
          set -e

          if [ $CURL_STATUS -ne 0 ]; then
            echo "::error::Permintaan HTTP ekstraksi gagal dengan kode keluar curl: $CURL_STATUS."
            if [ -n "$RESPONSE" ]; then
              echo "Respon Server: $RESPONSE"
            fi
            exit 1
          fi

          echo "Server Response: $RESPONSE"

          if [[ "$RESPONSE" == *"DEPLOY_SUCCESS"* ]]; then
            echo "🎉 Deployment successfully extracted and completed!"
          else
            echo "::error::Ekstraksi deployment gagal. Output: $RESPONSE"
            exit 1
          fi
