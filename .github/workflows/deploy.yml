name: Deploy to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, bcmath, fileinfo
          coverage: none

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Composer Dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: 🎨 Install NPM & Build Vite Assets
        run: |
          npm ci || npm install
          npm run build

      - name: 📂 Prepare Public Directory for cPanel
        run: |
          mkdir -p deploy_public
          cp -r public/* deploy_public/
          # Sesuaikan path di index.php agar mengarah ke folder ../ukk_rapi
          sed -i "s|__DIR__.'/../storage|__DIR__.'/../ukk_rapi/storage|g" deploy_public/index.php
          sed -i "s|__DIR__.'/../vendor|__DIR__.'/../ukk_rapi/vendor|g" deploy_public/index.php
          sed -i "s|__DIR__.'/../bootstrap|__DIR__.'/../ukk_rapi/bootstrap|g" deploy_public/index.php

      - name: 🚀 Deploy Core App to cPanel (ukk_rapi)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          server-dir: ukk_rapi/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github*
            **/.github*/**
            **/node_modules/**
            **/.env*
            **/public/**
            **/deploy_public/**
            **/tests/**
            **/*.sql
            **/*.zip

      - name: 🚀 Deploy Public Assets to cPanel (public_html)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./deploy_public/
          server-dir: public_html/

